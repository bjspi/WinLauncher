[package]
name = "winlauncher_native"
version = "0.14.4"
edition = "2021"
license = "MIT"
description = "Optional native search engine for WinLauncher"

[lib]
name = "winlauncher_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py311"] }  # extension-module: via maturin
fancy-regex = "0.14"
memchr = "2.7"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
regex = "1.12.4"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
grep-matcher = "0.1.9"

[profile.release]
lto = "thin"

