[package]
name = "pathscout_native"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Optional native search engine for PathScout"

[lib]
name = "pathscout_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311"] }
unicode-normalization = "=0.1.22"
fancy-regex = "0.14"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
fnmatch-rs = "0.1.0"
regex = "1.12.4"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
grep-matcher = "0.1.9"

[profile.release]
lto = "thin"

