[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "winlauncher-native"
version = "0.14.0"
description = "Optional Rust acceleration for WinLauncher search"
requires-python = ">=3.11,<3.15"  # Unicode tables exist for 3.11-3.14.
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.txt"]

[tool.maturin]
features = ["pyo3/extension-module"]

