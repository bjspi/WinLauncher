name: CI

# Jobs run in parallel wherever nothing connects them: the Rust engine wheel is
# compiled once, with a cache, and every Rust test job installs that same wheel.
# pip is not cached: its key would follow pyproject.toml, which every release
# changes, and each miss would store another ~1 GB that crowds out the Rust cache.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: python -m ruff check winlauncher tests tools native/tools
      - run: python -m ruff format --check winlauncher tests tools native/tools
      - run: python tools/build_loader.py --check

  loader:
    name: Windows loader
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: loader
      # Release packages reuse the committed host. App version bumps never rebuild it.
      - run: cargo fmt --manifest-path loader/Cargo.toml --check
      - run: cargo clippy --manifest-path loader/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path loader/Cargo.toml --locked

  native-wheel:
    name: Rust engine wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path native/Cargo.toml --locked
      - run: python -m pip install maturin==1.15.0
      - name: Build the abi3 wheel, the same for every Python version
        run: python native/tools/build.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-wheel
          path: dist/winlauncher_native-*.whl
          if-no-files-found: error

  tests-without-extension:
    name: Tests without the optional extension
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
        env:
          WINLAUNCHER_SEARCH_ENGINE: auto

  tests:
    name: ${{ matrix.engine }} engine on Python ${{ matrix.python }}
    needs: native-wheel
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.12', engine: python}
          - {python: '3.12', engine: native, smoke: true}
          # The abi3 wheel selects Unicode tables per interpreter.
          - {python: '3.11', engine: native}
          - {python: '3.13', engine: native}
          - {python: '3.14', engine: native}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: native-wheel
          path: dist
      - run: python -m pip install -e . (Get-ChildItem dist/winlauncher_native-*.whl).FullName
      - run: python -m unittest discover -s tests -v
        env:
          WINLAUNCHER_SEARCH_ENGINE: ${{ matrix.engine }}
      - name: Qt and Windows keyboard smoke test
        if: matrix.smoke
        run: python tools/smoke_test.py --native
        env:
          WINLAUNCHER_SEARCH_ENGINE: native

  packages:
    name: Packages
    needs: native-wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: native-wheel
          path: dist
      - run: python -m pip install build
      - name: Build and verify Python wheel and source distribution
        run: |
          python -m build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_packages.py
      - name: Install built Python and Rust wheels
        run: >-
          python -m pip install (Get-ChildItem dist/winlauncher-*.whl).FullName
          (Get-ChildItem dist/winlauncher_native-*.whl).FullName
      - name: Import installed packages outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -c "from PySide6.QtWidgets import QApplication; from winlauncher.settings import Settings;
          from winlauncher.ui.settings import SettingsDialog; from winlauncher.ui.theme import app_icon;
          from winlauncher.ui.website_icons import WebsiteIcons;
          from winlauncher.search.native_engine import select_native;
          app = QApplication([]); dialog = SettingsDialog(Settings(), website_icons=WebsiteIcons());
          assert not app_icon().isNull();
          assert select_native() is not None; print('Installed Python and Rust wheels imported successfully')"
      - uses: actions/upload-artifact@v4
        with:
          name: winlauncher-windows-packages
          path: dist/*
          if-no-files-found: error

  # One required check for branch protection and the release workflow.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, loader, native-wheel, tests-without-extension, tests, packages]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
