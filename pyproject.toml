[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathscout"
version = "0.2.1"
description = "Local file search and application launcher for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["PySide6>=6.7,<7", "pywin32>=306; sys_platform == 'win32'"]

[project.gui-scripts]
pathscout = "pathscout.__main__:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["pathscout*"]

[tool.setuptools.package-data]
"pathscout.ui" = ["assets/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
