[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winlauncher"
version = "0.15.2"
description = "Local file search and application launcher for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    # PySide6 6.12.0 aborts the process at random (on CI with Python 3.11 and 3.12).
    # Raise the limit only after the test suite passes on the new release.
    "PySide6>=6.7,<6.12",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The Rust search engine wheel of this release; the release workflow checks the version.
rust = [
    "winlauncher_native @ https://github.com/bjspi/WinLauncher/releases/download/v0.15.2/winlauncher_native-0.15.2-cp311-abi3-win_amd64.whl ; sys_platform == 'win32' and python_version < '3.15'",
]

[project.gui-scripts]
winlauncher = "winlauncher.__main__:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["winlauncher*"]

[tool.setuptools.package-data]
"winlauncher.ui" = ["assets/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
